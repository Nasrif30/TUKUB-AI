version: "1.0"

llm:
  active_provider: ollama
  providers:
    ollama:
      enabled: true
      url: http://localhost:11434
      default_model: llama3.2
    groq:
      enabled: false
      api_key: null
      default_model: llama3-70b-8192
    openrouter:
      enabled: false
      api_key: null
      default_model: google/gemini-2.0-flash-exp:free
    nvidia:
      enabled: false
      api_key: null
      default_model: meta/llama3-70b
    huggingface:
      enabled: false
      api_key: null
      default_model: mistralai/Mistral-7B-Instruct-v0.2
    openai:
      enabled: false
      api_key: null
      default_model: gpt-4o
    anthropic:
      enabled: false
      api_key: null
      default_model: claude-3-sonnet-20240229

agent:
  max_iterations: 20
  tool_timeout: 300
  retry_on_failure: true

tools:
  install_path: /usr/local/bin
  auto_update: false

reports:
  format: markdown
  output_dir: ~/.tukub/reports/
  include_raw: true

jailbreak:
  default_method: pentester_mode
  aggressive_mode: false
  auto_escalate: true

logging:
  level: INFO
  file: ~/.tukub/tukub.log